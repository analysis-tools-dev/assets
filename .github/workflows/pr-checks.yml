name: PR Checks

on:
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run build

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            junit.xml
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for known vulnerabilities
        run: |
          audit_status=0
          npm audit --audit-level=critical --json > audit-results.json || audit_status=$?
          cat audit-results.json

          # Missing counts or error responses must not be treated as a clean audit.
          if ! jq -e -s '
            length == 1 and (.[0] |
              type == "object" and .error == null and
              (.metadata.vulnerabilities |
                type == "object" and
                ([.info, .low, .moderate, .high, .critical] |
                all(.[]; type == "number" and . >= 0 and . == floor))))
          ' audit-results.json > /dev/null; then
            echo "::error::npm audit returned an invalid or error report (exit status $audit_status)."
            exit 1
          fi

          HIGH_VULNS=$(jq -r '.metadata.vulnerabilities.high' audit-results.json)
          CRITICAL_VULNS=$(jq -r '.metadata.vulnerabilities.critical' audit-results.json)
          echo "Critical vulnerabilities: $CRITICAL_VULNS"
          echo "High vulnerabilities: $HIGH_VULNS"

          if [ "$HIGH_VULNS" -gt 0 ]; then
            echo "::warning::High vulnerabilities found. Consider fixing them."
          fi
          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "::error::Critical vulnerabilities found. Please fix them before merging."
            exit 1
          fi
          if [ "$audit_status" -ne 0 ]; then
            echo "::error::npm audit failed with exit status $audit_status."
            exit 1
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, Unlicense
          fail-on-scopes: runtime
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
        continue-on-error: true

  build-dry-run:
    name: Test Build and Dry Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Test dry run execution
        run: timeout 60s npm run dev -- --dry-run || [ $? -eq 124 ]
        env:
          IMAGEKIT_PUBLIC_KEY: "dummy-key"
          IMAGEKIT_PRIVATE_KEY: "dummy-key"

  pr-status-check:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test, security, dependency-review, build-dry-run]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "Lint and Type Check: ${{ needs.lint-and-type-check.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Dependency Review: ${{ needs.dependency-review.result }}"
          echo "Build Dry Run: ${{ needs.build-dry-run.result }}"

          # Require every blocking job to complete successfully
          if [[ "${{ needs.lint-and-type-check.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.security.result }}" != "success" ||
                "${{ needs.build-dry-run.result }}" != "success" ]]; then
            echo "❌ One or more required checks did not succeed"
            exit 1
          else
            echo "✅ All critical checks passed!"

            # Log dependency review result but don't fail on it
            if [[ "${{ needs.dependency-review.result }}" == "failure" ]]; then
              echo "⚠️ Dependency review found issues but continuing (non-blocking)"
            fi
          fi